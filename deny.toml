# `cargo deny check` (CI): known vulnerabilities, unexpected licenses, and crate sources.
[graph]
all-features = true

[advisories]
# Unmaintained crates are reported by #267 follow-ups instead of failing every PR.
unmaintained = "workspace"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# `notify` (config file watching, #294) is CC0; allow it for that crate only.
exceptions = [{ allow = ["CC0-1.0"], crate = "notify" }]

[bans]
# Duplicate versions are known and benign (base64, getrandom, windows-sys, syn); see #267.
multiple-versions = "allow"
wildcards = "deny"
# Workspace path deps have no version; every crate is `publish = false`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
