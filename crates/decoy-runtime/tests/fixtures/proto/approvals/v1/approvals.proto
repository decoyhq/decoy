syntax = "proto3";

package approvals.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service Approvals {
  rpc GetApproval(GetApprovalRequest) returns (Approval);
  rpc WatchApprovals(WatchRequest) returns (stream Approval);
  rpc UploadEvidence(stream Approval) returns (Approval);
}

message GetApprovalRequest { string id = 1; }

message WatchRequest { repeated string ids = 1; }

message Approval {
  string id = 1;
  State state = 2;
  repeated string approvers = 3;
  map<string, string> labels = 4;
  Reviewer reviewer = 5;
  int32 priority = 6;
  int64 created_at_ms = 7;
  bytes evidence = 8;
  double score = 9;
}

message Sample {
  float ratio = 1;
  repeated float ratios = 2;
  map<string, float> weights = 3;
  google.protobuf.FloatValue boxed_ratio = 4;
  google.protobuf.Int64Value limit = 5;
  google.protobuf.Timestamp at = 6;
}

message Reviewer {
  string name = 1;
  bool admin = 2;
}

enum State {
  STATE_UNSPECIFIED = 0;
  PENDING = 1;
  APPROVED = 2;
  REJECTED = 3;
}
