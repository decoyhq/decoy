[package]
name = "decoy-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", features = ["http2", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# `ring` is installed as the default provider in `http_forward`, so the binary carries one crypto library.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
webpki-root-certs = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
percent-encoding = "2"
walkdir = "2"
globset = "0.4"
jmespath = "0.5"
fastrand = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
protox = "0.10.0"
prost-reflect = { version = "0.16.5", features = ["serde"] }
base64 = "0.23"
prost = "0.14"
http-body = "1"
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
time = "0.3"
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
notify = "8"
rmpv = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
# Tests build clients before any passthrough installs `ring`, so give them a fallback provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[[bench]]
name = "serving"
harness = false

[[bench]]
name = "grpc"
harness = false
