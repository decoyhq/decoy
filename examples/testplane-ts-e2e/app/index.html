<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Decoy Testplane E2E</title>
  </head>
  <body>
    <h1>Users</h1>
    <button id="load-user" type="button">Load user</button>
    <button id="load-user-2" type="button">Load second user</button>
    <button id="load-orders" type="button">Load orders</button>
    <button id="load-profile" type="button">Load profile</button>
    <button id="send-echo" type="button">Send echo</button>
    <button id="open-popup" type="button" onclick="window.open('/popup.html')">Open popup</button>
    <p id="result" role="status"></p>
    <script type="module">
      const result = document.querySelector('#result')

      // Success shows the payload's name; failures show status, Decoy's miss marker, and error.
      async function show(path, init) {
        const response = await fetch(path, init)
        const body = await response.json().catch(() => ({}))
        if (response.ok) {
          result.textContent = body.name
          return
        }
        const miss = response.headers.get('x-mock-miss') === 'true' ? ' (Decoy miss)' : ''
        result.textContent = `Error ${response.status}${miss}: ${body.error ?? ''}`
      }

      document.querySelector('#load-user').addEventListener('click', () => show('/api/users/1'))
      document.querySelector('#load-user-2').addEventListener('click', () => show('/api/users/2'))
      // No Decoy Route serves /api/orders: it demonstrates the fail-closed miss.
      document.querySelector('#load-orders').addEventListener('click', () => show('/api/orders'))
      // Decoy forwards /api/profile to the example's local upstream (Passthrough).
      document.querySelector('#load-profile').addEventListener('click', () => show('/api/profile'))
      // Decoy echoes the body, a cookie, and a custom header back (mocks/routes/echo.yaml).
      document.querySelector('#send-echo').addEventListener('click', () => {
        document.cookie = 'sid=abc'
        show('/api/echo', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-client': 'app' },
          body: JSON.stringify({ name: 'Ada' }),
        })
      })
    </script>
  </body>
</html>
