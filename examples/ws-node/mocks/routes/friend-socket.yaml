id: friend-socket
transport: ws
match:
  path: /subscribe
  query: { service: my-friend-webservice } # other params (client=browser) are ignored
cases:
  hello:
    on: connect # runs once, when the socket opens
    behaviors:
      ping: { message: ping }
      silent: { messages: [] }
      unauthorized:
        messages:
          - { payload: { type: error, reason: unauthorized } }
          - { payload: goodbye }
        close: { code: 4001, reason: unauthorized }
  status:
    match: { message: { type: get-status } } # runs on each matching message
    behaviors:
      online: { message: { id: '${ message.id }', status: online } }
      offline: { message: { id: '${ message.id }', status: offline } }
  bye:
    match: { message: { type: bye } }
    behaviors:
      close: { close: { code: 4002, reason: bye } }
  noise: # chatter the page sends that needs no answer
    match: { message: { type: noise } }
    behaviors:
      quiet: { messages: [] }
  subscribe:
    match: { message: { type: subscribe } }
    behaviors:
      updates:
        messages:
          - { payload: { id: '${ message.id }', type: subscribed, topic: '${ message.topic }' } }
          - { payload: { type: snapshot, topic: '${ message.topic }' } }
          - { payload: { type: update, topic: '${ message.topic }', count: 1 }, delay: 200ms }
