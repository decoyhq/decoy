id: transformer-sdk-host
transport: ws
match: { path: /ws/transformer/sdk-host }
pipeline: [transformer/sdk-host]
cases:
  watch:
    match: { message: { ids: [a-1] } }
    behaviors:
      reply: { message: { id: a-1, state: APPROVED } }
  lookup:
    match: { message: { id: a-1 } }
    behaviors:
      reply: { message: { id: a-1, state: PENDING } }
