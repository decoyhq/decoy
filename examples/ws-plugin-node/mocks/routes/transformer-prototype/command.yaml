id: transformer-command
transport: ws
match: { path: /ws/transformer/command }
pipeline: transformer-command
cases:
  watch:
    match: { message: { ids: [a-1] } }
    behaviors:
      reply: { message: { id: a-1, state: APPROVED } }
  lookup:
    match: { message: { id: a-1 } }
    behaviors:
      reply: { message: { id: a-1, state: PENDING } }
