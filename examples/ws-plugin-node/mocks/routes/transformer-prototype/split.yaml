id: transformer-split
transport: ws
match: { path: /ws/transformer/split }
transformer:
  inbound:
    - [
        node,
        transformer-prototype/command.mjs,
        strip-grpc,
        transformer-prototype/schema-map.json,
        approval,
      ]
    - [
        node,
        transformer-prototype/command.mjs,
        read-proto,
        transformer-prototype/schema-map.json,
        approval,
      ]
  outbound:
    - [
        node,
        transformer-prototype/command.mjs,
        write-proto,
        transformer-prototype/schema-map.json,
        approval,
      ]
    - [
        node,
        transformer-prototype/command.mjs,
        add-grpc,
        transformer-prototype/schema-map.json,
        approval,
      ]
cases:
  watch:
    match: { message: { ids: [a-1] } }
    behaviors:
      reply: { message: { id: a-1, state: APPROVED } }
  lookup:
    match: { message: { id: a-1 } }
    behaviors:
      reply: { message: { id: a-1, state: PENDING } }
