routes: routes
collections: collections.yaml
port: 8095 # WebSocket upgrades and the Control API share this port

protos:
  roots: [../proto] # plugins reach these through ctx.protobuf; they load no .proto files

plugins:
  transformer:
    command: node ../transformer-prototype/bridge.mjs ../transformer-prototype/schema-map.json approval
    timeout: 5s
  # Each entry is one process, started with Decoy. Its key namespaces its steps: `env/envelope`.
  env:
    command: node ../plugins/typed-envelope.ts # the file calls definePlugin, which serves
  rpc:
    command: node ../plugins/binary-rpc.ts
    timeout: 2s

pipelines:
  approvals-ws: [env/envelope]
  rpc: [rpc/frame]
  transformer-sdk: [transformer/sdk]
  transformer-sdk-host: [transformer/sdk-host]
  transformer-command:
    inbound:
      - [
          node,
          ../transformer-prototype/command.mjs,
          inbound,
          ../transformer-prototype/schema-map.json,
          approval,
        ]
    outbound:
      - [
          node,
          ../transformer-prototype/command.mjs,
          outbound,
          ../transformer-prototype/schema-map.json,
          approval,
        ]
  transformer-native:
    inbound:
      - [
          ../../../target/debug/examples/ws_transformer,
          inbound,
          ../transformer-prototype/schema-map.json,
          ../proto,
          approval,
        ]
    outbound:
      - [
          ../../../target/debug/examples/ws_transformer,
          outbound,
          ../transformer-prototype/schema-map.json,
          ../proto,
          approval,
        ]
  transformer-split:
    inbound:
      - [
          node,
          ../transformer-prototype/command.mjs,
          strip-grpc,
          ../transformer-prototype/schema-map.json,
          approval,
        ]
      - [
          node,
          ../transformer-prototype/command.mjs,
          read-proto,
          ../transformer-prototype/schema-map.json,
          approval,
        ]
    outbound:
      - [
          node,
          ../transformer-prototype/command.mjs,
          write-proto,
          ../transformer-prototype/schema-map.json,
          approval,
        ]
      - [
          node,
          ../transformer-prototype/command.mjs,
          add-grpc,
          ../transformer-prototype/schema-map.json,
          approval,
        ]
