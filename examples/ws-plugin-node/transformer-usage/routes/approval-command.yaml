id: approval-command
transport: ws
match: { path: /ws/approval-command }
transformer:
  inbound:
    - [
        node,
        transformer-prototype/command.mjs,
        inbound,
        transformer-usage/schema-map.json,
        approval,
      ]
  outbound:
    - [
        node,
        transformer-prototype/command.mjs,
        outbound,
        transformer-usage/schema-map.json,
        approval,
      ]
cases:
  watch:
    match: { message: { ids: [a-1] } }
    behaviors:
      approved: { message: { id: a-1, state: APPROVED } }
  lookup:
    match: { message: { id: a-1 } }
    behaviors:
      pending: { message: { id: a-1, state: PENDING } }
