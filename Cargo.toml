[workspace]
members = ["crates/decoy", "crates/decoy-runtime", "crates/decoy-tui"]
resolver = "3"

[workspace.package]
# Shared by the decoy binary and every published npm package; change it with `task release`.
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/decoyhq/decoy"

[profile.release]
strip = true
# Smaller, faster release binaries for a modest build-time cost (#267).
lto = "thin"
codegen-units = 1
