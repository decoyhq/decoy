# Git hooks managed by lefthook (https://lefthook.dev)
# Hooks are installed on `pnpm install` (lefthook's postinstall runs `lefthook install`).

pre-commit:
  piped: true
  commands:
    1_oxlint:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    2_prettier:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,md,yml,yaml,html,css}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    3_rustfmt:
      glob: '*.rs'
      # rustfmt alone defaults to edition 2015; match the workspace edition in Cargo.toml.
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
