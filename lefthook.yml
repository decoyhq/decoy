# Git hooks managed by lefthook (https://lefthook.dev)
# Hooks are installed on `pnpm install` (lefthook's postinstall runs `lefthook install`).

pre-commit:
  piped: true
  commands:
    1_eslint:
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    2_prettier:
      glob: '*.{js,mjs,ts,tsx,json,md,yml,yaml,html,css}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
