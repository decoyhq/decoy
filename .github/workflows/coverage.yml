# JS coverage, uploaded to Codecov with OIDC (no token secret). Rust coverage comes from the
# `rust` job in ci.yml, which runs the tests once.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: JS coverage
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --filter './packages/*' exec rstest run --coverage

      - uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: packages/cli/coverage/lcov.info,packages/playwright/coverage/lcov.info
          flags: js
