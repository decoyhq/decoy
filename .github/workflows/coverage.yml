# JS coverage, uploaded to Codecov with OIDC (no token secret). Rust coverage comes from the
# `rust` job in ci.yml, which runs the tests once.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: JS coverage
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --filter './packages/*' exec rstest run --coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: packages/cli/coverage/lcov.info,packages/playwright/coverage/lcov.info,packages/plugin/coverage/lcov.info,packages/runner-core/coverage/lcov.info,packages/testplane/coverage/lcov.info
          flags: js
