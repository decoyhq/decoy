name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips satisfy `required`. Main and ci:full PRs opt out of path filtering.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.scope.outputs.js }}
      lint: ${{ steps.scope.outputs.lint }}
      js-lint: ${{ steps.scope.outputs.js-lint }}
      rust: ${{ steps.scope.outputs.rust }}
      e2e: ${{ steps.scope.outputs.e2e }}
      js-coverage: ${{ steps.scope.outputs.js-coverage }}
      codeql: ${{ steps.scope.outputs.codeql }}
      ub-mode: ${{ steps.ub-mode.outputs.changed }}
      examples: ${{ steps.find.outputs.examples }}
      has-examples: ${{ steps.find.outputs.has-examples }}
      browser-examples: ${{ steps.find.outputs.browser-examples }}
      has-browser-examples: ${{ steps.find.outputs.has-browser-examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # The PR merge commit and its base parent.
      - id: scope
        env:
          CI_FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          policy=.github/scripts/ci_scope.py
          if [[ "$CI_FULL" == true ]] ||
             ! git diff --quiet --no-ext-diff HEAD^1 HEAD -- "$policy" ||
             ! git cat-file -e "HEAD^1:$policy"; then
            # A new or changed classifier cannot decide which checks validate it.
            printf '%s\n' lint=true js-lint=true rust=true versions=true js=true js-coverage=true e2e=true \
              'codeql=["actions","javascript-typescript","rust"]' >> "$GITHUB_OUTPUT"
          else
            base_policy=$(git show "HEAD^1:$policy")
            python3 -I - <<< "$base_policy"
          fi
      - name: Test path policy
        run: python3 -B -m unittest discover -s .github/scripts -p test_ci_scope.py
      - name: Check published versions against Cargo.toml
        if: steps.scope.outputs.versions == 'true' && steps.scope.outputs.js != 'true'
        run: node scripts/versions.mjs check
      - id: ub-mode
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          changed=$(python3 .github/scripts/ub_mode_report.py --check-paths)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # Example workspaces (the e2e tier, `test:e2e`); ones depending on @playwright/test or
      # testplane get the browser job, which installs Chromium. An empty list skips that job.
      - id: find
        if: steps.scope.outputs.e2e == 'true'
        run: |
          shopt -s nullglob
          plain=()
          browser=()
          for dir in examples/*/; do
            pkg="${dir}package.json"
            [ -f "$pkg" ] || continue
            name="$(basename "$dir")"
            # @playwright/test or testplane ⇒ real Chromium ⇒ the dedicated browser job.
            if jq -e '[.devDependencies, .dependencies] | map(. // {} | has("@playwright/test") or has("testplane")) | any' "$pkg" >/dev/null; then
              browser+=("$name")
            else
              plain+=("$name")
            fi
          done
          emit() {
            local key="$1"; shift
            if [ "$#" -eq 0 ]; then
              echo "has-$key=false" >> "$GITHUB_OUTPUT"
              echo "$key=[]" >> "$GITHUB_OUTPUT"
            else
              echo "has-$key=true" >> "$GITHUB_OUTPUT"
              echo "$key=$(printf '%s\n' "$@" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
            fi
          }
          emit examples "${plain[@]}"
          emit browser-examples "${browser[@]}"

  # Docs-only changes run just the install and lint (prettier covers Markdown).
  # --ignore-scripts skips the root `prepare` build; js runs build explicitly below.
  ci:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit npm dependencies
        if: needs.changes.outputs.js == 'true'
        # Testplane pins old transitive versions with high advisories; it is a dev dependency and
        # peer there, never shipped, so those two workspaces audit production dependencies only.
        run: |
          pnpm audit --audit-level high --filter '!@decoyhq/testplane' --filter '!@decoyhq-examples/testplane-ts-e2e'
          pnpm audit --prod --audit-level high --filter @decoyhq/testplane --filter @decoyhq-examples/testplane-ts-e2e

      - name: Lint & format check
        if: needs.changes.outputs.js-lint == 'true'
        run: pnpm check

      - name: Format check only
        if: needs.changes.outputs.js-lint != 'true'
        run: pnpm exec prettier --check .

      - name: Typecheck
        if: needs.changes.outputs.js == 'true'
        run: pnpm typecheck

      - name: Build
        if: needs.changes.outputs.js == 'true'
        run: pnpm build

      - name: Check published package shape (publint, are-the-types-wrong)
        if: needs.changes.outputs.js == 'true'
        run: pnpm --filter @decoyhq/playwright --filter @decoyhq/testplane --filter @decoyhq/transformer run check:package

      - name: Test
        if: needs.changes.outputs.js == 'true'
        run: pnpm test

  js-coverage:
    if: github.event_name == 'pull_request' && needs.changes.outputs.js-coverage == 'true'
    needs: changes
    uses: $/.github/workflows/coverage.yml
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    with:
      ub-mode: ${{ needs.changes.outputs.ub-mode == 'true' }}

  codeql:
    if: github.event_name == 'pull_request' && needs.changes.outputs.codeql != '[]'
    needs: changes
    uses: $/.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: ${{ needs.changes.outputs.codeql }}

  # fmt, clippy, cargo-deny and the tests (run once, with coverage for Codecov).
  rust:
    needs: changes
    outputs:
      ub-lcov: ${{ steps.ub-lcov.outputs.artifact-id }}
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Restores main's build cache; only main saves, so PRs don't evict each other.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Known vulnerabilities, unexpected licenses and crate sources (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories licenses bans sources

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Test (with coverage)
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --locked --workspace --lcov --output-path rust.lcov

      - id: ub-lcov
        if: needs.changes.outputs.ub-mode == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ub-lcov-rust-${{ github.run_attempt }}
          path: rust.lcov
          retention-days: 1

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: rust.lcov
          flags: rust

  # The JS package tests on Windows and macOS (they cover the win32 process branches); Linux runs
  # them in `ci`.
  unit-os:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # --no-bail: report every package's failures, not just the first.
      - name: Test JS packages
        run: pnpm -r --no-bail run test

  # Builds `decoy` once for every e2e job below (examples run it via DECOY_BINARY_PATH).
  build-decoy:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && (needs.changes.outputs.has-examples == 'true' || needs.changes.outputs.has-browser-examples == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Restores main's build cache; only main saves, so PRs don't evict each other.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build decoy binary
        run: cargo build --locked -p decoy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoy
          path: target/debug/decoy
          if-no-files-found: error
          retention-days: 1

  # One job per non-browser example, running just that example's `test:e2e`.
  example-e2e:
    needs: [changes, build-decoy]
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.has-examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.examples) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # --ignore-scripts skips the root `prepare` build; the build step below runs it once.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Examples are real consumers: they boot Decoy through a config loaded at
      # runtime, which resolves `@decoyhq/*` to built `./dist` (the `default` export
      # condition). So e2e runs against built packages — internal package tests are
      # the build-free tier (they activate the `source` condition; see CONTRIBUTING).
      - name: Build @decoyhq packages
        run: pnpm build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decoy
          path: ${{ runner.temp }}/decoy

      # Examples run DECOY_BINARY_PATH instead of `cargo run`; artifacts drop the exec bit.
      - name: Use prebuilt decoy
        run: |
          chmod +x "$RUNNER_TEMP/decoy/decoy"
          echo "DECOY_BINARY_PATH=$RUNNER_TEMP/decoy/decoy" >> "$GITHUB_ENV"

      - name: e2e
        env:
          EXAMPLE: ${{ matrix.example }}
        run: pnpm --filter "./examples/$EXAMPLE" run test:e2e

  # One job per browser example. The root install scripts skip Playwright's browser
  # download (pnpm-workspace.yaml), so we install Chromium + its system deps here —
  # never in the default `pnpm test`.
  example-e2e-browser:
    needs: [changes, build-decoy]
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.has-browser-examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e-browser (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.browser-examples) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Examples run against built packages (same as the non-browser e2e job): they
      # boot Decoy through a runtime-loaded config that resolves `@decoyhq/*` to `./dist`.
      - name: Build @decoyhq packages
        run: pnpm build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decoy
          path: ${{ runner.temp }}/decoy

      # Examples run DECOY_BINARY_PATH instead of `cargo run`; artifacts drop the exec bit.
      - name: Use prebuilt decoy
        run: |
          chmod +x "$RUNNER_TEMP/decoy/decoy"
          echo "DECOY_BINARY_PATH=$RUNNER_TEMP/decoy/decoy" >> "$GITHUB_ENV"

      - name: Install Chromium (+ system deps)
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          pkg="examples/$EXAMPLE/package.json"
          uses() { jq -e --arg dep "$1" '[.devDependencies, .dependencies] | map(. // {} | has($dep)) | any' "$pkg" >/dev/null; }
          if uses @playwright/test; then
            pnpm --filter "./examples/$EXAMPLE" exec playwright install --with-deps chromium
          fi
          # Testplane downloads Chrome for Testing and chromedriver for its `gridUrl: 'local'`.
          if uses testplane; then
            pnpm --filter "./examples/$EXAMPLE" exec testplane install-deps
          fi

      - name: e2e
        env:
          EXAMPLE: ${{ matrix.example }}
        run: pnpm --filter "./examples/$EXAMPLE" run test:e2e

  ub-mode:
    if: ${{ !cancelled() && needs.changes.outputs.ub-mode == 'true' }}
    needs: [changes, rust, js-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - if: needs.rust.outputs.ub-lcov != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rust.outputs.ub-lcov }}
          path: ${{ runner.temp }}/ub-lcov/rust

      - if: needs.js-coverage.outputs.ub-lcov != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.js-coverage.outputs.ub-lcov }}
          path: ${{ runner.temp }}/ub-lcov/js/packages

      - name: Analyze source changes
        run: |
          printf 'Analysis unavailable. See the UB-mode job log.\n' > "$RUNNER_TEMP/ub-mode.txt"
          python3 -m venv "$RUNNER_TEMP/ub-venv"
          "$RUNNER_TEMP/ub-venv/bin/pip" install --disable-pip-version-check \
            'tree-sitter==0.26.1' 'tree-sitter-language-pack==1.25.2' \
            'crapper @ git+https://github.com/unclebob/crapper.git@c757ec79a6c15dc815238bbd9c2f4601eb54d3cc' \
            'dryer @ git+https://github.com/unclebob/dryer.git@66ff6d21a42c04afcad89c78a80066176d1294b0'
          "$RUNNER_TEMP/ub-venv/bin/python" .github/scripts/ub_mode_report.py \
            --coverage "$RUNNER_TEMP/ub-lcov" --output "$RUNNER_TEMP/ub-mode.txt"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ub-mode-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ub-mode.txt
          if-no-files-found: error
          retention-days: 1

  # Stable aggregate for branch rulesets; individual blocking jobs can be skipped.
  required:
    if: always()
    needs:
      - changes
      - ci
      - rust
      - unit-os
      - build-decoy
      - example-e2e
      - example-e2e-browser
      - js-coverage
      - codeql
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed (or was skipped)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
