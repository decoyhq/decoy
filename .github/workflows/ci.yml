name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed, and which examples exist. Jobs below skip what a change can't affect (a skipped
  # job still satisfies `required`); pushes to main run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ github.event_name == 'push' || steps.filter.outputs.js == 'true' }}
      docs: ${{ github.event_name == 'push' || steps.filter.outputs.docs == 'true' }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      e2e: ${{ github.event_name == 'push' || steps.filter.outputs.e2e == 'true' }}
      examples: ${{ steps.find.outputs.examples }}
      has-examples: ${{ steps.find.outputs.has-examples }}
      browser-examples: ${{ steps.find.outputs.browser-examples }}
      has-browser-examples: ${{ steps.find.outputs.has-browser-examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - .prototools
            rust:
              - *shared
              - 'crates/**'
              - 'Cargo.*'
              - rust-toolchain.toml
              - deny.toml
            # Code and config only; Markdown is `docs`, which just lints.
            js:
              - *shared
              - '{packages,examples}/**/*.{ts,mts,cts,js,mjs,cjs,json,yaml,yml,proto,html,css}'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.*'
            docs:
              - '**/*.md'
            e2e:
              - *shared
              - 'crates/**'
              - 'Cargo.*'
              - '{packages,examples}/**/*.{ts,mts,cts,js,mjs,cjs,json,yaml,yml,proto,html,css}'
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'tsconfig*.json'
      # Example workspaces (the e2e tier, `test:e2e`); ones depending on @playwright/test get the
      # browser job, which installs Chromium. An empty list skips that job.
      - id: find
        run: |
          shopt -s nullglob
          plain=()
          browser=()
          for dir in examples/*/; do
            pkg="${dir}package.json"
            [ -f "$pkg" ] || continue
            name="$(basename "$dir")"
            # @playwright/test ⇒ real Chromium ⇒ the dedicated browser job.
            if jq -e '(.devDependencies["@playwright/test"] // .dependencies["@playwright/test"]) != null' "$pkg" >/dev/null; then
              browser+=("$name")
            else
              plain+=("$name")
            fi
          done
          emit() {
            local key="$1"; shift
            if [ "$#" -eq 0 ]; then
              echo "has-$key=false" >> "$GITHUB_OUTPUT"
              echo "$key=[]" >> "$GITHUB_OUTPUT"
            else
              echo "has-$key=true" >> "$GITHUB_OUTPUT"
              echo "$key=$(printf '%s\n' "$@" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
            fi
          }
          emit examples "${plain[@]}"
          emit browser-examples "${browser[@]}"

  # Docs-only changes run just the install and lint (prettier covers Markdown).
  # --ignore-scripts skips the root `prepare` build; js runs build explicitly below.
  ci:
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit npm dependencies
        if: needs.changes.outputs.js == 'true'
        run: pnpm audit --audit-level high

      - name: Lint & format check
        run: pnpm check

      - name: Typecheck
        if: needs.changes.outputs.js == 'true'
        run: pnpm typecheck

      - name: Build
        if: needs.changes.outputs.js == 'true'
        run: pnpm build

      - name: Check published package shape (publint, are-the-types-wrong)
        if: needs.changes.outputs.js == 'true'
        run: pnpm --filter @decoyhq/playwright run check:package

      - name: Test
        if: needs.changes.outputs.js == 'true'
        run: pnpm test

  # fmt, clippy, cargo-deny and the tests (run once, with coverage for Codecov).
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Restores main's build cache; only main saves, so PRs don't evict each other.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Known vulnerabilities, unexpected licenses and crate sources (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Test (with coverage)
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --lcov --output-path rust.lcov

      - uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: rust.lcov
          flags: rust

  # One job per non-browser example, running just that example's `test:e2e`.
  example-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.has-examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Examples start Decoy with `cargo run`; one cache shared by every e2e job, saved on main.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Examples are real consumers: they boot Decoy through a config loaded at
      # runtime, which resolves `@decoyhq/*` to built `./dist` (the `default` export
      # condition). So e2e runs against built packages — internal package tests are
      # the build-free tier (they activate the `source` condition; see CONTRIBUTING).
      - name: Build @decoyhq packages
        run: pnpm build

      - name: e2e
        env:
          EXAMPLE: ${{ matrix.example }}
        run: pnpm --filter "./examples/$EXAMPLE" run test:e2e

  # One job per browser example. The root install scripts skip Playwright's browser
  # download (pnpm-workspace.yaml), so we install Chromium + its system deps here —
  # never in the default `pnpm test`.
  example-e2e-browser:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.has-browser-examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e-browser (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.browser-examples) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Examples run against built packages (same as the non-browser e2e job): they
      # boot Decoy through a runtime-loaded config that resolves `@decoyhq/*` to `./dist`.
      - name: Build @decoyhq packages
        run: pnpm build

      # Examples start native Decoy with `cargo run`; build it up front so startup is quick.
      - name: Build decoy binary
        run: cargo build -p decoy-runtime

      - name: Install Chromium (+ system deps)
        env:
          EXAMPLE: ${{ matrix.example }}
        run: pnpm --filter "./examples/$EXAMPLE" exec playwright install --with-deps chromium

      - name: e2e
        env:
          EXAMPLE: ${{ matrix.example }}
        run: pnpm --filter "./examples/$EXAMPLE" run test:e2e

  # The one check the `main` ruleset requires, so jobs and example matrices can change freely.
  required:
    if: always()
    needs: [changes, ci, rust, example-e2e, example-e2e-browser]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed (or was skipped)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
