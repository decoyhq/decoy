name: Install script

# Runs scripts/install.{sh,ps1} against the newest published release on every platform.
on:
  pull_request:
    paths: ['scripts/install.sh', 'scripts/install.ps1', '.github/workflows/install-script.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-latest]
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install (sh)
        if: runner.os != 'Windows'
        run: |
          sh scripts/install.sh
          ~/.decoy/bin/decoy --version

      - name: Install (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1
          & "$HOME\.decoy\bin\decoy.exe" --version
