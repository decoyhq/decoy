# Security lint for these workflows; findings go to Security → Code scanning.
name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.7.1
