name: Release

# A pushed `v*` tag builds every target, publishes a GitHub Release, then the npm packages.
# Pull requests that touch the release path (and manual runs) build and smoke-test everything
# without publishing, as a dry run.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/npm-platform-packages.mjs'
      - 'scripts/install.*'
      - 'packages/cli/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: read
        name: Read the workspace version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: version
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, runner: macos-14 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Add target
        shell: bash # so "$TARGET" is the env var on Windows too (PowerShell reads it as $env:TARGET)
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash # so "$TARGET" is the env var on Windows too (PowerShell reads it as $env:TARGET)
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p decoy --target "$TARGET"

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="decoy-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/decoy.exe" "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" > /dev/null)
          else
            cp "target/$TARGET/release/decoy" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi

      - name: Smoke test
        if: ${{ !startsWith(matrix.target, 'x86_64-apple') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out="$(./target/$TARGET/release/decoy --version)"
          echo "$out"
          [ "$out" = "decoy $VERSION" ]

      - uses: actions/upload-artifact@v7
        with:
          name: decoy-${{ matrix.target }}
          # Archives only: the staging folders (decoy-<version>-<target>/) also contain dots.
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Install scripts (default to this release)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed "s/DECOY_VERSION:-latest}}/DECOY_VERSION:-$VERSION}}/" scripts/install.sh > dist/install.sh
          sed "s/} else { 'latest' }/} else { '$VERSION' }/" scripts/install.ps1 > dist/install.ps1
          grep -q "$VERSION" dist/install.sh && grep -q "$VERSION" dist/install.ps1

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip install.* > SHA256SUMS && cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A pre-release never becomes Latest here; promote one with `task release:latest`.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/install.* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"

  npm-smoke:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Build npm packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @decoyhq/cli build
          node scripts/npm-platform-packages.mjs archives npm

      - name: Install the packed CLI into an empty project
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          which -a npm && npm --version # publish-npm relies on proto's npm (trusted publishing)
          # pnpm pack rewrites `catalog:`/`workspace:` ranges; npm pack would ship them verbatim.
          (cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP")
          (cd npm/cli-linux-x64 && npm pack --pack-destination "$RUNNER_TEMP")
          if tar -xOzf "$RUNNER_TEMP/decoyhq-cli-$VERSION.tgz" package/package.json | grep -E '"(catalog|workspace):'; then
            echo "packed manifest still has catalog:/workspace: ranges" >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            "$RUNNER_TEMP/decoyhq-cli-linux-x64-$VERSION.tgz" "$RUNNER_TEMP/decoyhq-cli-$VERSION.tgz"
          out="$(node_modules/.bin/decoy --version)"
          echo "$out"
          [ "$out" = "decoy $VERSION" ]

  publish-npm:
    needs: [version, release, npm-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); provenance is attached automatically
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/npm-platform-packages.mjs archives npm

      - name: Publish (platform packages first, then @decoyhq/cli and @decoyhq/playwright)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # No token: each package trusts this repo's release.yml on npmjs.com (Trusted Publisher).
        # Trusted publishing needs npm >= 11.5.1; npm is pinned in .prototools.
        run: |
          npm --version
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          for dir in npm/*/; do
            (cd "$dir" && npm publish --access public --tag "$tag")
          done
          # Workspace packages go through pnpm pack, which resolves `catalog:`/`workspace:` ranges.
          packed="$RUNNER_TEMP/packed" && mkdir -p "$packed"
          (cd packages/cli && pnpm pack --pack-destination "$packed")
          (cd packages/playwright && pnpm pack --pack-destination "$packed")
          for tarball in "$packed"/decoyhq-cli-*.tgz "$packed"/decoyhq-playwright-*.tgz; do
            npm publish "$tarball" --access public --tag "$tag"
          done
