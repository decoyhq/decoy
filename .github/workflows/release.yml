name: Release

# A pushed `v*` tag builds every target and publishes a GitHub Release. Pull requests that touch
# this workflow (and manual runs) build every target without publishing, as a dry run.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read the workspace version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: version
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, runner: macos-14 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p decoy-runtime --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="decoy-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/decoy.exe" "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/decoy" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi

      - name: Smoke test
        if: ${{ !startsWith(matrix.target, 'x86_64-apple') }}
        shell: bash
        run: |
          out="$(./target/${{ matrix.target }}/release/decoy --version)"
          echo "$out"
          [ "$out" = "decoy ${{ needs.version.outputs.version }}" ]

      - uses: actions/upload-artifact@v4
        with:
          name: decoy-${{ matrix.target }}
          path: dist/*.*
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
