name: Release

# A pushed `v*` tag builds every target, publishes a GitHub Release, then the npm packages.
# Pull requests that touch the release path (and manual runs) build and smoke-test everything
# without publishing, as a dry run.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/npm-platform-packages.mjs'
      - 'scripts/versions.mjs'
      - 'scripts/install.*'
      - 'packages/cli/**'
      - 'packages/playwright/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        name: Read the workspace version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: version
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, runner: macos-14 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Add target
        shell: bash # so "$TARGET" is the env var on Windows too (PowerShell reads it as $env:TARGET)
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash # so "$TARGET" is the env var on Windows too (PowerShell reads it as $env:TARGET)
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p decoy --target "$TARGET"

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="decoy-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/decoy.exe" "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" > /dev/null)
          else
            cp "target/$TARGET/release/decoy" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi

      - name: Smoke test
        if: ${{ !startsWith(matrix.target, 'x86_64-apple') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out="$(./target/$TARGET/release/decoy --version)"
          echo "$out"
          [ "$out" = "decoy $VERSION" ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoy-${{ matrix.target }}
          # Archives only: the staging folders (decoy-<version>-<target>/) also contain dots.
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build, npm-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Install scripts (default to this release)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed "s/DECOY_VERSION:-latest}}/DECOY_VERSION:-$VERSION}}/" scripts/install.sh > dist/install.sh
          sed "s/} else { 'latest' }/} else { '$VERSION' }/" scripts/install.ps1 > dist/install.ps1
          grep -q "$VERSION" dist/install.sh && grep -q "$VERSION" dist/install.ps1

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip install.* > SHA256SUMS && cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A pre-release never becomes Latest here; promote one with `task release:latest`.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          assets=(dist/*.tar.gz dist/*.zip dist/install.* dist/SHA256SUMS)
          # A rerun replaces the assets of the release an earlier attempt created.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"

  # The published release, installed through scripts/install.{sh,ps1} on every platform.
  install-script:
    needs: [version, release]
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    uses: $/.github/workflows/install-script.yml
    with:
      version: ${{ needs.version.outputs.version }}

  npm-smoke:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true

      - name: Build npm packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/npm-platform-packages.mjs archives npm

      # These exact tarballs are what publish-npm publishes, so what was tested is what ships.
      - name: Pack every npm package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          which -a npm && npm --version # publish-npm relies on proto's npm (trusted publishing)
          mkdir -p npm-tarballs
          for dir in npm/*/; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-tarballs")
          done
          # pnpm pack rewrites `catalog:`/`workspace:` ranges; npm pack would ship them verbatim.
          (cd packages/cli && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-tarballs")
          (cd packages/playwright && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-tarballs")
          (cd packages/testplane && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-tarballs")
          ls -l npm-tarballs
          for pkg in cli playwright testplane; do
            if tar -xOzf "npm-tarballs/decoyhq-$pkg-$VERSION.tgz" package/package.json | grep -E '"(catalog|workspace):'; then
              echo "packed @decoyhq/$pkg manifest still has catalog:/workspace: ranges" >&2
              exit 1
            fi
          done
          # Platform packages that can't run here must at least carry their binary.
          for tarball in npm-tarballs/decoyhq-cli-*-*-"$VERSION".tgz; do
            tar -tzf "$tarball" | grep -xE 'package/bin/decoy(\.exe)?' > /dev/null || { echo "$tarball has no binary" >&2; exit 1; }
          done

      - name: Install the packed packages into an empty project
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tarballs="$GITHUB_WORKSPACE/npm-tarballs"
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            "$tarballs/decoyhq-cli-linux-x64-$VERSION.tgz" "$tarballs/decoyhq-cli-$VERSION.tgz" \
            "$tarballs/decoyhq-playwright-$VERSION.tgz" "$tarballs/decoyhq-testplane-$VERSION.tgz"
          out="$(node_modules/.bin/decoy --version)"
          echo "$out"
          [ "$out" = "decoy $VERSION" ]
          # npm installs the @playwright/test peer; both module formats must load.
          node --input-type=module -e "await import('@decoyhq/playwright')"
          node -e "require('@decoyhq/playwright')"
          # Testplane loads plugins with require; tests import `decoy` as ESM.
          node --input-type=module -e "await import('@decoyhq/testplane')"
          node -e "require('@decoyhq/testplane')"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: [version, release, npm-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); provenance is attached automatically
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (proto reads .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: npm-tarballs

      - name: Publish (platform packages first, then @decoyhq/cli and the test-runner packages)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # No token: each package trusts this repo's release.yml on npmjs.com (Trusted Publisher).
        # Trusted publishing needs npm >= 11.5.1; npm is pinned in .prototools.
        run: |
          npm --version
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          cd npm-tarballs
          for tarball in decoyhq-cli-*-*-"$VERSION".tgz "decoyhq-cli-$VERSION.tgz" "decoyhq-playwright-$VERSION.tgz" "decoyhq-testplane-$VERSION.tgz"; do
            name="$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            # A rerun after a partial publish skips what already made it to the registry.
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION already published, skipping"
              continue
            fi
            pkg_tag="$tag"
            # A backport (0.1.9 after 0.2.0) must not move `latest` back; it gets `v0.1-latest`.
            # No `latest` yet (first publish, npm E404) keeps `latest`; any other lookup error stops.
            if ! current="$(npm view "$name" dist-tags.latest 2> "$RUNNER_TEMP/npm-view.err")"; then
              grep -q E404 "$RUNNER_TEMP/npm-view.err" || { cat "$RUNNER_TEMP/npm-view.err" >&2; exit 1; }
              current=
            fi
            if [ "$tag" = latest ] && [ -n "$current" ] && node -e '
              const [a, b] = process.argv.slice(1).map((v) => v.split("-")[0].split(".").map(Number));
              process.exit((a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) < 0 ? 0 : 1);
            ' "$VERSION" "$current"; then
              pkg_tag="v$(echo "$VERSION" | cut -d. -f1-2)-latest"
            fi
            npm publish "$tarball" --access public --tag "$pkg_tag"
          done
