packages:
  - 'apps/*'
  - 'packages/*'
  - 'examples/*'
  # Stand-in third-party plugin packages the ws-plugin-node example depends on.
  - 'examples/ws-plugin-node/acme/*'
# Versions shared by several workspaces; reference them as "catalog:" in package.json.
catalog:
  '@grpc/grpc-js': ^1.14.0
  '@grpc/proto-loader': ^0.8.0
  '@playwright/test': ^1.56.0
  testplane: ^9.3.0
  '@microsoft/api-extractor': ^7.59.4
  '@types/node': ^24.19.2
# pnpm 11+ reads its settings here, not from .npmrc.
engineStrict: true
autoInstallPeers: true
# Skip versions published in the last day (most malicious releases are pulled within hours).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@decoyhq/*'
allowBuilds:
  lefthook: true
  # Only a postinstall version notice; the gRPC example does not need it.
  protobufjs: false
  # Testplane downloads browsers and drivers on demand; these postinstalls only prefetch drivers.
  '@testplane/edgedriver': false
  '@testplane/geckodriver': false
  edgedriver: false
  geckodriver: false
  # Platform binaries come from optional dependencies; the postinstall only verifies them.
  esbuild: false
