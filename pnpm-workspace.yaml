packages:
  - 'packages/*'
  - 'examples/*'
# Versions shared by several workspaces; reference them as "catalog:" in package.json.
catalog:
  '@grpc/grpc-js': ^1.14.0
  '@grpc/proto-loader': ^0.8.0
  '@playwright/test': ^1.56.0
  '@types/node': ^24.0.0
allowBuilds:
  lefthook: true
  # Only a postinstall version notice; the gRPC example does not need it.
  protobufjs: false
